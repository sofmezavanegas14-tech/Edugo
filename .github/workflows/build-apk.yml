name: EduGo IA - Generar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Construir EduGo.apk
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar aplicación web
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f js/edugo-supabase.js
          mkdir -p www/js
          cp index.html www/index.html
          cp -R js/. www/js/

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Crear configuración Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.edugo.app",
            "appName": "EduGo",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar EduGo.apk
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/EduGo.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EduGo-IA-APK
          path: release/EduGo.apk
          retention-days: 30
