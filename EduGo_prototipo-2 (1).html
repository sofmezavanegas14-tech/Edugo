<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduGo — Organiza, aprende y avanza</title>
<style>
:root{
  --primary:#5b5ce2; --primary2:#7b61ff; --bg:#f5f7fb; --card:#fff;
  --text:#202335; --muted:#697086; --border:#e5e7ef; --ok:#20a66a;
  --danger:#d9534f; --shadow:0 10px 30px rgba(39,44,76,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:var(--primary)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-weight:900}
.user-mini{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:#ecebff;color:var(--primary);display:grid;place-items:center;font-weight:800}
.layout{display:grid;grid-template-columns:230px 1fr;max-width:1280px;margin:auto}
.sidebar{padding:18px 12px;border-right:1px solid var(--border);min-height:calc(100vh - 68px)}
.navbtn{width:100%;text-align:left;background:transparent;padding:12px 14px;border-radius:12px;margin-bottom:5px;color:var(--muted)}
.navbtn:hover,.navbtn.active{background:#ecebff;color:var(--primary);font-weight:700}
.content{padding:22px;max-width:900px;width:100%;margin:auto}
.page-title{margin:0 0 5px;font-size:28px}
.subtitle{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{background:linear-gradient(135deg,#5b5ce2,#7b61ff);color:#fff;border:0}
.hero p{color:#ececff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{padding:16px;border:1px solid var(--border);border-radius:15px;background:#fff}
.stat strong{font-size:25px;display:block}
.btn{padding:10px 15px;border-radius:11px;background:var(--primary);color:#fff;font-weight:700}
.btn.secondary{background:#ecebff;color:var(--primary)}
.btn.ghost{background:#f1f2f7;color:var(--text)}
.btn.danger{background:#fff0ef;color:var(--danger)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input,.textarea,.select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary)}
.textarea{min-height:90px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.post{position:relative}
.post-head{display:flex;gap:10px;align-items:center}
.post-name{font-weight:800}
.post-meta{font-size:12px;color:var(--muted)}
.post-body{line-height:1.55;margin:14px 0}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef0f8;color:#596078}
.badge.public{background:#eaf8f1;color:#168252}
.badge.private{background:#fff4dc;color:#9a6700}
.actions{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.action{background:transparent;color:var(--muted);padding:7px 9px;border-radius:9px}
.action:hover{background:#f1f2f7}
.comment{background:#f7f8fb;border-radius:12px;padding:10px;margin-top:8px}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.done{text-decoration:line-through;color:#9aa0b0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{min-height:75px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}
.day small{color:var(--muted)}
.event{font-size:11px;margin-top:5px;padding:4px;border-radius:6px;background:#ecebff;color:#4e4fc8}
.subject{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(430px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.login .brand{justify-content:center;margin-bottom:20px}
.notice{padding:11px 13px;border-radius:10px;background:#f0f3ff;color:#4b50a9;font-size:13px;margin:10px 0}
.modal-back{position:fixed;inset:0;background:rgba(15,18,35,.45);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:18px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.bottom-nav{display:none}
.empty{text-align:center;color:var(--muted);padding:28px}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.small{font-size:13px;color:var(--muted)}
@media(max-width:760px){
  .layout{display:block}
  .sidebar{display:none}
  .content{padding:15px 12px 82px}
  .grid,.form-grid{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:8px 4px}
  .bottom-nav button{background:transparent;color:var(--muted);font-size:12px}
  .bottom-nav button.active{color:var(--primary);font-weight:800}
  .topbar{height:60px}
}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login">
    <div class="brand"><div class="logo">E</div>EduGo</div>
    <h1>Organiza, aprende y avanza.</h1>
    <p class="subtitle">Comunidad escolar + agenda académica en un solo lugar.</p>
    <div class="notice">Prototipo escolar: los datos se guardan en este navegador.</div>
    <label class="small">Nombre</label>
    <input id="loginName" class="input" placeholder="Ej. Sofía" value="Sofía">
    <label class="small">Tipo de cuenta</label>
    <select id="loginRole" class="select">
      <option value="Estudiante">Estudiante</option>
      <option value="Directivo">Directivo</option>
    </select>
    <button class="btn" style="width:100%;margin-top:14px" onclick="login()">Entrar a EduGo</button>
    <p class="small" style="margin-top:14px">En una versión real, el inicio de sesión usaría cuentas seguras y una base de datos.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><div class="logo">E</div>EduGo</div>
    <div class="user-mini"><span id="userLabel"></span><div id="userAvatar" class="avatar">S</div></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <button class="navbtn active" data-page="home" onclick="showPage('home')">🏠 Inicio</button>
      <button class="navbtn" data-page="forum" onclick="showPage('forum')">💬 Foro</button>
      <button class="navbtn" data-page="tasks" onclick="showPage('tasks')">📝 Mis tareas</button>
      <button class="navbtn" data-page="calendar" onclick="showPage('calendar')">📅 Calendario</button>
      <button class="navbtn" data-page="study" onclick="showPage('study')">📚 Zona de estudio</button>
      <button class="navbtn" data-page="subjects" onclick="showPage('subjects')">📖 Mis materias</button>
      <button class="navbtn" data-page="messages" onclick="showPage('messages')">✉️ Mensajes</button>
      <button class="navbtn" data-page="project" onclick="showPage('project')">ℹ️ Proyecto</button>
      <hr>
      <button class="navbtn" onclick="logout()">🚪 Cerrar sesión</button>
    </aside>
    <main id="content" class="content"></main>
  </div>
  <nav class="bottom-nav">
    <button data-page="home" onclick="showPage('home')">🏠<br>Inicio</button>
    <button data-page="forum" onclick="showPage('forum')">💬<br>Foro</button>
    <button data-page="tasks" onclick="showPage('tasks')">📝<br>Tareas</button>
    <button data-page="calendar" onclick="showPage('calendar')">📅<br>Calendario</button>
    <button data-page="study" onclick="showPage('study')">📚<br>Estudio</button>
  </nav>
</div>

<div id="modal" class="modal-back hidden" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()"><div id="modalBody"></div></div>
</div>

<script>
const defaultPosts=[
 {id:1,name:"Sofía",role:"Estudiante",text:"¿Alguien quiere compartir consejos para estudiar para el próximo examen de matemáticas?",privacy:"public",likes:4,comments:[{name:"Valentina",text:"Yo hago resúmenes y ejercicios."}]},
 {id:2,name:"Coordinación Académica",role:"Directivo",text:"Recuerden revisar el calendario: esta semana hay actividades académicas importantes.",privacy:"public",likes:7,comments:[]}
];
let state=JSON.parse(localStorage.getItem("edugoState")||"null")||{
 user:null, posts:defaultPosts, tasks:[
  {id:1,title:"Taller de matemáticas",subject:"Matemáticas",date:"2026-08-25",done:false},
  {id:2,title:"Lectura de español",subject:"Español",date:"2026-08-27",done:false}
 ],events:[
  {title:"Examen de Matemáticas",date:"2026-08-25"},
  {title:"Entrega de Español",date:"2026-08-27"},
  {title:"Actividad escolar",date:"2026-08-29"}
 ],messages:[],page:"home"
};
function save(){localStorage.setItem("edugoState",JSON.stringify(state))}
function login(){
 const name=document.getElementById("loginName").value.trim()||"Estudiante";
 state.user={name,role:document.getElementById("loginRole").value}; state.page="home"; save(); boot();
}
function logout(){state.user=null;save();boot()}
function boot(){
 document.getElementById("loginScreen").classList.toggle("hidden",!!state.user);
 document.getElementById("app").classList.toggle("hidden",!state.user);
 if(state.user){document.getElementById("userLabel").textContent=state.user.name+" · "+state.user.role;document.getElementById("userAvatar").textContent=state.user.name[0].toUpperCase();showPage(state.page||"home")}
}
function showPage(p){
 state.page=p;save();
 document.querySelectorAll(".navbtn,.bottom-nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));
 const views={home:homeView,forum:forumView,tasks:tasksView,calendar:calendarView,study:studyView,subjects:subjectsView,messages:messagesView,project:projectView};
 document.getElementById("content").innerHTML=views[p]();
 if(p==="forum")renderPosts();
 if(p==="tasks")renderTasks();
 if(p==="calendar")renderCalendar();
 if(p==="messages")renderMessages();
}
function homeView(){
 const next=state.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date))[0];
 const ev=state.events.slice().sort((a,b)=>a.date.localeCompare(b.date))[0];
 return `<h1 class="page-title">¡Hola, ${esc(state.user.name)}! 👋</h1>
 <p class="subtitle">Todo lo que necesitas para organizar tu vida escolar.</p>
 <div class="card hero"><h2>EduGo</h2><p>“Organiza, aprende y avanza.”</p><button class="btn secondary" onclick="showPage('forum')">Entrar al foro</button></div>
 <div class="grid">
  <div class="stat"><span class="small">Próxima tarea</span><strong>${next?esc(next.title):"Sin tareas"}</strong><span class="small">${next?next.date:"Todo al día"}</span></div>
  <div class="stat"><span class="small">Próximo evento</span><strong>${ev?esc(ev.title):"Sin eventos"}</strong><span class="small">${ev?ev.date:"Agrega uno"}</span></div>
 </div>
 <div class="card"><h3>🚀 Accesos rápidos</h3><div class="row">
 <button class="btn" onclick="showPage('tasks')">📝 Mis tareas</button><button class="btn secondary" onclick="showPage('calendar')">📅 Calendario</button><button class="btn secondary" onclick="showPage('study')">📚 Estudiar</button></div></div>
 <div class="card"><h3>💡 Recordatorio</h3><p>Organiza tus tareas, revisa tus fechas y participa responsablemente en la comunidad escolar.</p></div>`;
}
function forumView(){return `<h1 class="page-title">💬 Foro EduGo</h1><p class="subtitle">Publica, comenta y comparte ideas con estudiantes y directivos.</p>
 <div class="card"><h3>Crear publicación</h3>
 <textarea id="postText" class="textarea" placeholder="¿Qué quieres compartir con la comunidad?"></textarea>
 <div class="row" style="margin-top:10px"><select id="postPrivacy" class="select" style="max-width:180px"><option value="public">🌐 Pública</option><option value="private">🔒 Privada</option></select><button class="btn" onclick="addPost()">Publicar</button></div></div>
 <div id="posts"></div>`}
function addPost(){
 const text=document.getElementById("postText").value.trim(); if(!text)return alert("Escribe algo antes de publicar.");
 state.posts.unshift({id:Date.now(),name:state.user.name,role:state.user.role,text,privacy:document.getElementById("postPrivacy").value,likes:0,comments:[]});save();showPage("forum")
}
function renderPosts(){
 const el=document.getElementById("posts");
 const visible=state.posts.filter(p=>p.privacy==="public"||p.name===state.user.name);
 el.innerHTML=visible.length?visible.map(p=>`<article class="card post"><div class="post-head"><div class="avatar">${esc(p.name[0])}</div><div><div class="post-name">${esc(p.name)} <span class="badge">${esc(p.role)}</span> <span class="badge ${p.privacy}">${p.privacy==="public"?"🌐 Pública":"🔒 Privada"}</span></div><div class="post-meta">Publicación de la comunidad</div></div></div>
 <div class="post-body">${esc(p.text)}</div><div class="actions"><button class="action" onclick="likePost(${p.id})">👍 ${p.likes}</button><button class="action" onclick="toggleComments(${p.id})">💬 ${p.comments.length}</button><button class="action" onclick="sendTo('${jsq(p.name)}')">✉️ Mensaje</button></div>
 <div id="comments-${p.id}" class="hidden"><div style="margin-top:10px">${p.comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b><br>${esc(c.text)}</div>`).join("")}</div><div class="row" style="margin-top:10px"><input id="comment-${p.id}" class="input" placeholder="Escribe un comentario"><button class="btn" onclick="commentPost(${p.id})">Comentar</button></div></div></article>`).join(""):`<div class="empty">No hay publicaciones visibles.</div>`;
}
function likePost(id){const p=state.posts.find(x=>x.id===id);p.likes++;save();renderPosts()}
function toggleComments(id){document.getElementById("comments-"+id).classList.toggle("hidden")}
function commentPost(id){const input=document.getElementById("comment-"+id),text=input.value.trim();if(!text)return;state.posts.find(p=>p.id===id).comments.push({name:state.user.name,text});save();renderPosts();document.getElementById("comments-"+id).classList.remove("hidden")}
function tasksView(){return `<h1 class="page-title">📝 Mis tareas</h1><p class="subtitle">Organiza tus actividades y marca lo que ya terminaste.</p>
 <div class="card"><h3>Agregar tarea</h3><div class="form-grid"><input id="taskTitle" class="input" placeholder="Nombre de la tarea"><input id="taskSubject" class="input" placeholder="Materia"><input id="taskDate" class="input" type="date"><button class="btn" onclick="addTask()">Agregar tarea</button></div></div><div class="card"><div id="taskList"></div></div>`}
function addTask(){let title=document.getElementById("taskTitle").value.trim();let subject=document.getElementById("taskSubject").value.trim()||"General";let date=document.getElementById("taskDate").value;if(!title||!date)return alert("Completa nombre y fecha.");state.tasks.push({id:Date.now(),title,subject,date,done:false});save();showPage("tasks")}
function renderTasks(){const el=document.getElementById("taskList");const list=state.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date));el.innerHTML=list.length?list.map(t=>`<div class="task"><div><b class="${t.done?"done":""}">${esc(t.title)}</b><div class="small">${esc(t.subject)} · ${t.date}</div></div><div class="row"><button class="btn secondary" onclick="toggleTask(${t.id})">${t.done?"↩️ Reabrir":"✅ Completar"}</button><button class="btn danger" onclick="deleteTask(${t.id})">🗑️</button></div></div>`).join(""):`<div class="empty">No tienes tareas registradas.</div>`}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();showPage("tasks")}
function deleteTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();showPage("tasks")}
function calendarView(){return `<h1 class="page-title">📅 Calendario</h1><p class="subtitle">Exámenes, trabajos y actividades escolares.</p><div class="card"><div id="calendar"></div></div><div class="card"><h3>Agregar evento</h3><div class="form-grid"><input id="eventTitle" class="input" placeholder="Examen, trabajo o actividad"><input id="eventDate" class="input" type="date"><button class="btn" onclick="addEvent()">Agregar evento</button></div></div>`}
function renderCalendar(){const el=document.getElementById("calendar");let now=new Date();let y=now.getFullYear(),m=now.getMonth();let first=new Date(y,m,1).getDay();let days=new Date(y,m+1,0).getDate();let h="<div class='calendar'>"+["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map(d=>`<div class='small'><b>${d}</b></div>`).join("");for(let i=0;i<first;i++)h+="<div></div>";for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;let es=state.events.filter(e=>e.date===ds);h+=`<div class='day'><b>${d}</b>${es.map(e=>`<div class='event'>${esc(e.title)}</div>`).join("")}</div>`}el.innerHTML=h+"</div>"}
function addEvent(){let title=document.getElementById("eventTitle").value.trim(),date=document.getElementById("eventDate").value;if(!title||!date)return alert("Completa el evento.");state.events.push({title,date});save();showPage("calendar")}
function studyView(){return `<h1 class="page-title">📚 Zona de estudio</h1><p class="subtitle">Recursos y consejos para estudiar mejor.</p><div class="grid">
 <div class="card"><h3>⏱️ Técnica 25/5</h3><p>Estudia 25 minutos y descansa 5. Repite el ciclo y haz una pausa más larga después de varios ciclos.</p></div>
 <div class="card"><h3>📝 Resúmenes</h3><p>Escribe las ideas principales con tus propias palabras y usa ejemplos sencillos.</p></div>
 <div class="card"><h3>🎯 Metas pequeñas</h3><p>Divide una tarea grande en pasos cortos y marca cada avance.</p></div>
 <div class="card"><h3>🤝 Comunidad</h3><p>Pregunta en el foro y comparte recursos académicos respetando a los demás.</p></div>
 </div>`}
function subjectsView(){let subs=["Matemáticas","Español","Ciencias","Sociales","Inglés","Cosmetología","Etc."];return `<h1 class="page-title">📖 Mis materias</h1><p class="subtitle">Accede a tus áreas escolares.</p><div class="card">${subs.map(s=>`<div class="subject"><span>📘 ${s}</span><button class="btn secondary" onclick="showSubject('${jsq(s)}')">Ver</button></div>`).join("")}</div>`}
function showSubject(s){openModal(`<h2>📘 ${esc(s)}</h2><p>Esta sección puede contener tareas, apuntes, recursos y publicaciones relacionadas con ${esc(s)}.</p><button class="btn" onclick="closeModal()">Cerrar</button>`)}
function messagesView(){return `<h1 class="page-title">✉️ Mensajes</h1><p class="subtitle">Comunícate con otros miembros de la comunidad escolar.</p><div class="card"><div class="row"><input id="msgTo" class="input" placeholder="Destinatario" style="max-width:220px"><input id="msgText" class="input" placeholder="Escribe un mensaje"><button class="btn" onclick="sendMessage()">Enviar</button></div></div><div id="messageList"></div>`}
function sendMessage(){let to=document.getElementById("msgTo").value.trim(),text=document.getElementById("msgText").value.trim();if(!to||!text)return alert("Completa destinatario y mensaje.");state.messages.unshift({from:state.user.name,to,text});save();showPage("messages")}
function sendTo(name){showPage("messages");setTimeout(()=>{document.getElementById("msgTo").value=name},0)}
function renderMessages(){document.getElementById("messageList").innerHTML=state.messages.length?state.messages.map(m=>`<div class="card"><b>${esc(m.from)}</b> → <b>${esc(m.to)}</b><p>${esc(m.text)}</p></div>`).join(""):`<div class="empty">Todavía no tienes mensajes.</div>`}
function projectView(){return `<h1 class="page-title">ℹ️ Proyecto EduGo</h1><p class="subtitle">Resumen para presentar el proyecto de TecnoMax.</p>
 <div class="card"><h3>Nombre</h3><p><b>EduGo</b></p><p><b>Slogan:</b> “Organiza, aprende y avanza.”</p><p><b>Significado:</b> Edu = educación · Go = avanzar.</p></div>
 <div class="card"><h3>Problema</h3><p>Muchos estudiantes olvidan tareas, exámenes y actividades o tienen dificultades para organizar su tiempo de estudio. EduGo reúne esta información y además crea una comunidad escolar.</p></div>
 <div class="card"><h3>Objetivo general</h3><p>Crear una aplicación que ayude a los estudiantes del colegio a organizar sus tareas, exámenes, horarios y actividades escolares de una manera sencilla.</p><h3>Objetivos específicos</h3><ul><li>Organizar tareas pendientes.</li><li>Recordar fechas de exámenes y trabajos.</li><li>Mostrar el horario de clases.</li><li>Ayudar a organizar el tiempo.</li><li>Proporcionar consejos y recursos para estudiar.</li><li>Facilitar la comunicación entre estudiantes y directivos.</li></ul></div>
 <div class="card"><h3>¿A quién va dirigida?</h3><p>Principalmente a estudiantes del colegio, especialmente quienes necesitan ayuda para organizar sus actividades académicas, y también a directivos que necesiten comunicar información escolar.</p></div>
 <div class="card"><h3>Funciones principales</h3><ul><li>Cuenta de estudiante o directivo.</li><li>Foro con publicaciones, reacciones y comentarios.</li><li>Publicaciones públicas o privadas.</li><li>Mensajes privados.</li><li>Inicio con próxima tarea, próximo examen y recordatorios.</li><li>Mis materias: Matemáticas, Español, Ciencias, Sociales, Inglés, Cosmetología y otras.</li><li>Mis tareas con nombre, materia, fecha y estado pendiente/completada.</li><li>Calendario de exámenes, trabajos y actividades.</li><li>Zona de estudio con pequeños resúmenes y consejos.</li></ul></div>
 <div class="card"><h3>Diseño</h3><ul><li>Fondo claro.</li><li>Botones grandes.</li><li>Íconos fáciles de reconocer.</li><li>Letras grandes y fáciles de leer.</li><li>Menú inferior: Inicio | Foro | Tareas | Calendario | Estudio.</li></ul></div>
 <div class="card"><h3>Pantallas</h3><ol><li>Pantalla de inicio.</li><li>Inicio de sesión.</li><li>Menú principal.</li><li>Foro.</li><li>Mis tareas.</li><li>Calendario.</li><li>Zona de estudio.</li><li>Mensajes.</li><li>Mis materias.</li></ol></div>
